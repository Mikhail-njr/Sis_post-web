<!-- Modal de Crear Lote -->
        <div id="createLoteModal" class="edit-modal">
            <div class="edit-form" style="max-width: 600px;">
                <h3 style="margin-bottom: 20px; color: #eef2f7;">📦 Crear Nuevo Lote</h3>

                <form id="createLoteForm">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div class="form-group">
                            <label for="loteProductoId">Producto *</label>
                            <select id="loteProductoId" required style="width: 100%; padding: 10px; border: 2px solid #030303; border-radius: 6px;">
                                <option value="">Seleccionar producto</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="loteNumero">Número de Lote *</label>
                            <input type="text" id="loteNumero" required style="width: 100%; padding: 10px; border: 2px solid #030303; border-radius: 6px;">
                            <div id="loteSuggestion" style="margin-top: 5px; font-size: 12px; color: #666; display: none; cursor: pointer;" onclick="useLoteSuggestion()">
                                💡 Sugerencia: <span id="suggestedLote" style="text-decoration: underline;"></span>
                            </div>
                        </div>
                    </div>
