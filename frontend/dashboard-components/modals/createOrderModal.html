<!-- Modal de Crear Pedido -->
        <div id="createOrderModal" class="edit-modal">
            <div class="edit-form" style="max-width: 800px;">
                <h3 style="margin-bottom: 20px; color: #f3f6fa;">📋 Crear Nuevo Pedido a Proveedor</h3>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                    <div class="form-group">
                        <label for="orderSupplierId">Proveedor *</label>
                        <select id="orderSupplierId" required style="width: 100%; padding: 10px; border: 2px solid #030303; border-radius: 6px;">
                            <option value="">Cargando proveedores...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="orderDate">Fecha de Pedido *</label>
                        <input type="date" id="orderDate" required style="width: 100%; padding: 10px; border: 2px solid #030303; border-radius: 6px;">
                        <small style="color: #666; font-size: 12px;">Fecha en la que se realizó el pedido</small>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                    <div class="form-group">
                        <label for="orderDeliveryDate">Fecha de Entrega Estimada</label>
                        <input type="date" id="orderDeliveryDate" style="width: 100%; padding: 10px; border: 2px solid #030303; border-radius: 6px;">
                    </div>
                </div>

                <div class="form-group">
                    <label for="orderNotes">Notas</label>
                    <textarea id="orderNotes" rows="3" placeholder="Notas adicionales del pedido..." style="width: 100%; padding: 10px; border: 2px solid #030303; border-radius: 6px;"></textarea>
                </div>

                <div style="margin-bottom: 20px;">
                    <h4 style="color: #000000; margin-bottom: 10px;">Items del Pedido</h4>
                    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                        <button type="button" onclick="addOrderItem()" class="btn btn-secondary" style="font-size: 14px; padding: 8px 16px;">
                            ➕ Agregar Item
                        </button>
                        <button type="button" onclick="showInlineProductCreation()" class="btn btn-primary" style="font-size: 14px; padding: 8px 16px; background: #28a745;">
                            🆕 Crear Producto Nuevo
                        </button>
                    </div>

                    <!-- Inline Product Creation Form (hidden by default) -->
                    <div id="inlineProductCreation" style="display: none; background: #3f89d2; border: 2px solid #28a745; border-radius: 8px; padding: 15px; margin-bottom: 15px;">
                        <h5 style="color: #28a745; margin-bottom: 10px;">➕ Crear Nuevo Producto</h5>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <div class="form-group">
                                <label for="newProductCategoria" style="font-size: 12px; font-weight: bold;">Categoría *</label>
                                <input type="text" id="newProductCategoria" list="newProductCategoriaList" placeholder="Seleccionar o escribir nueva categoría" required style="width: 100%; padding: 6px; border: 1px solid #030303; border-radius: 4px; font-size: 12px;">
                                <datalist id="newProductCategoriaList">
                                    <option value="COND - Condimentos">
                                    <option value="BEB - Bebidas">
                                    <option value="ACEI - Aceites">
                                    <option value="VER - Verduras">
                                    <option value="FRUT - Frutas">
                                    <option value="CARN - Carnes">
                                    <option value="LACT - Lácteos">
                                    <option value="PAN - Panadería">
                                    <option value="CONF - Confitería">
                                    <option value="LIM - Limpieza">
                                    <option value="OTRO - Otros">
                                </datalist>
                            </div>
                            <div class="form-group">
                                <label for="newProductNombre" style="font-size: 12px; font-weight: bold;">Nombre *</label>
                                <input type="text" id="newProductNombre" placeholder="Nombre del producto" required style="width: 100%; padding: 6px; border: 1px solid #030303; border-radius: 4px; font-size: 12px;">
                            </div>
                            <div class="form-group">
                                <label for="newProductPrecio" style="font-size: 12px; font-weight: bold;">Precio *</label>
                                <input type="number" id="newProductPrecio" step="0.01" min="0" placeholder="0.00" required style="width: 100%; padding: 6px; border: 1px solid #030303; border-radius: 4px; font-size: 12px;">
                            </div>
                            <div class="form-group">
                                <label for="newProductStock" style="font-size: 12px; font-weight: bold;">Stock Inicial</label>
                                <input type="number" id="newProductStock" min="0" value="0" style="width: 100%; padding: 6px; border: 1px solid #030303; border-radius: 4px; font-size: 12px; background-color: #f8f9fa;">
                            </div>
                        </div>
                        <div style="display: flex; gap: 10px; margin-top: 10px;">
                            <button type="button" onclick="createProductInline()" class="btn btn-primary" style="font-size: 12px; padding: 6px 12px; background: #28a745;">✅ Crear Producto</button>
                            <button type="button" onclick="closeAddModal()" class="btn btn-secondary" style="font-size: 12px; padding: 6px 12px;">❌ Cancelar</button>
                        </div>
                    </div>

                    <div id="orderItemsContainer" style="max-height: 300px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 6px; padding: 10px;">
                        <!-- Los items se agregarán aquí dinámicamente -->
                    </div>

                    <div style="margin-top: 15px; padding: 15px; background: #0d0e0f; border-radius: 6px; text-align: right;">
                        <strong>Total del Pedido: <span id="orderTotal">$0,00</span></strong>
                    </div>
                </div>

                <div class="button-group">
                    <button type="button" class="btn btn-primary" onclick="createOrder()">Crear Pedido</button>
                    <button type="button" class="btn btn-secondary" onclick="closeCreateOrderModal()">Cancelar</button>
                </div>

                <script>
                    // Reset order when modal is opened
                    const orderModal = document.getElementById('createOrderModal');
                    const orderObserver = new MutationObserver(function(mutations) {
                        mutations.forEach(function(mutation) {
                            if (mutation.attributeName === 'class') {
                                if (orderModal.classList.contains('show')) {
                                    // Clear previous items and reset total
                                    document.getElementById('orderItemsContainer').innerHTML = '';
                                    document.getElementById('orderTotal').textContent = '$0,00';
                                    // Set default order date to today
                                    const today = new Date().toISOString().split('T')[0];
                                    document.getElementById('orderDate').value = today;
                                    // Set default delivery date to today
                                    document.getElementById('orderDeliveryDate').value = today;
                                }
                            }
                        });
                    });
                    orderObserver.observe(orderModal, { attributes: true });
                </script>
            </div>
        </div>
