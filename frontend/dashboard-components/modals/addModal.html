        <!-- Modal de agregar proveedor -->
        <div id="addSupplierModal" class="edit-modal">
            <div class="edit-form">
                <h3 style="margin-bottom: 20px; color: #eaeff5;">➕ Agregar Nuevo Proveedor</h3>
                <form id="addSupplierForm">
                    <div class="form-group">
                        <label for="addNombreProveedor">Nombre del Proveedor:</label>
                        <input type="text" id="addNombreProveedor" required placeholder="Ej: Distribuidora ABC">
                    </div>

                    <div class="form-group">
                        <label for="addNombreContacto">Nombre de Contacto:</label>
                        <input type="text" id="addNombreContacto" placeholder="Ej: Juan Pérez">
                    </div>

                    <div class="form-group">
                        <label for="addTelefono">Teléfono:</label>
                        <input type="tel" id="addTelefono" placeholder="Ej: +54 11 1234-5678">
                    </div>

                    <div class="form-group">
                        <label for="addEmail">Email:</label>
                        <input type="email" id="addEmail" placeholder="Ej: contacto@proveedor.com">
                    </div>

                    <div class="form-group">
                        <label for="addProductosServicios">Productos/Servicios:</label>
                        <textarea id="addProductosServicios" placeholder="Ej: Alimentos, Bebidas, Limpieza" rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="addCondicionesPago">Condiciones de Pago:</label>
                        <input type="text" id="addCondicionesPago" placeholder="Ej: 30 días, Contado, etc.">
                    </div>

                    <div class="form-group">
                        <label for="addEstatus">Estatus:</label>
                        <select id="addEstatus">
                            <option value="Activo">Activo</option>
                            <option value="Inactivo">Inactivo</option>
                            <option value="Pendiente">Pendiente</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="addNotas">Notas:</label>
                        <textarea id="addNotas" placeholder="Información adicional" rows="3"></textarea>
                    </div>

                    <div class="button-group">
                        <button type="button" class="btn btn-secondary" onclick="closeAddSupplierModal()">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Crear Proveedor</button>
                        <script>
                            document.getElementById('addSupplierForm').addEventListener('submit', createSupplier);
    
                            async function createSupplier(event) {
                                event.preventDefault();
                                
                                const formData = {
                                    nombre: document.getElementById('addNombreProveedor').value.trim(),
                                    nombreContacto: document.getElementById('addNombreContacto').value.trim(),
                                    telefono: document.getElementById('addTelefono').value.trim(),
                                    email: document.getElementById('addEmail').value.trim(),
                                    productosServicios: document.getElementById('addProductosServicios').value.trim(),
                                    condicionesPago: document.getElementById('addCondicionesPago').value.trim(),
                                    estatus: document.getElementById('addEstatus').value,
                                    notas: document.getElementById('addNotas').value.trim()
                                };
                                
                                // Validaciones básicas
                                if (!formData.nombre) {
                                    alert('Por favor ingresa el nombre del proveedor');
                                    return;
                                }
                                
                                try {
                                    const headers = { 'Content-Type': 'application/json' };
                                    if (authCredentials) {
                                        headers['Authorization'] = 'Basic ' + btoa(authCredentials.username + ':' + authCredentials.password);
                                    }
                                    
                                    const response = await fetch(`${window.ApiClient.API_BASE}/suppliers`, {
                                        method: 'POST',
                                        headers: headers,
                                        body: JSON.stringify(formData)
                                    });
                                    
                                    if (response.status === 401) {
                                        isLoggedIn = false;
                                        updateUIBasedOnAuth();
                                        throw new Error('Autenticación requerida');
                                    }
                                    if (!response.ok) {
                                        const errorData = await response.json();
                                        throw new Error(errorData.error || 'Error al crear proveedor');
                                    }
                                    
                                    const result = await response.json();
                                    
                                    alert('Proveedor creado exitosamente');
                                    closeAddSupplierModal();
                                    fetchSuppliers(); // Recargar la lista de proveedores
                                    
                                } catch (error) {
                                    console.error('Error creating supplier:', error);
                                    alert('Error al crear proveedor: ' + error.message);
                                }
                            }
                        </script>
                    </div>
                </form>
            </div>
        </div>
