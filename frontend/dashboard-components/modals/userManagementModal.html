<!-- Modal de gestión de usuarios -->
<div id="userManagementModal" class="edit-modal">
    <div class="edit-form" style="max-width: 700px; background: linear-gradient(145deg, #1e1e2e, #2a2a3e); border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);">
        
        <!-- Encabezado -->
        <div style="background: linear-gradient(90deg, #4CAF50, #45a049); padding: 20px; border-radius: 12px 12px 0 0; margin: -20px -20px 20px -20px;">
            <h3 style="margin: 0; color: white; font-size: 22px; display: flex; align-items: center; gap: 10px;">
                👥 Gestión de Usuarios
            </h3>
        </div>
        
        <!-- Lista de usuarios -->
        <div id="userList" style="max-height: 280px; overflow-y: auto; margin-bottom: 20px; background: #16161e; border-radius: 8px; padding: 10px;">
            <p style="color: #aaa; text-align: center; padding: 20px;">Cargando usuarios...</p>
        </div>

        <!-- Botón para agregar nuevo usuario -->
        <button type="button" class="btn btn-primary" onclick="showAddUserForm()" 
                style="margin-bottom: 15px; background: linear-gradient(90deg, #2196F3, #1976D2); border: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: transform 0.2s;">
            ➕ Agregar Usuario
        </button>

        <!-- Formulario para agregar/editar usuario (oculto por defecto) -->
        <div id="userForm" style="display: none; border: 1px solid #3a3a4e; border-radius: 8px; padding: 20px; background: #1a1a28; margin-top: 15px;">
            <h4 id="userFormTitle" style="color: #4CAF50; margin: 0 0 20px 0; font-size: 18px; border-bottom: 1px solid #3a3a4e; padding-bottom: 10px;">Nuevo Usuario</h4>
            
            <form id="userFormElement">
                <input type="hidden" id="editUserId">
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label for="username" style="color: #aaa; font-size: 13px; display: block; margin-bottom: 5px;">Usuario *</label>
                        <input type="text" id="username" required 
                               style="width: 100%; padding: 10px; background: #252535; border: 1px solid #3a3a4e; border-radius: 6px; color: white; box-sizing: border-box;"
                               placeholder="Ej: juanperez">
                    </div>

                    <div class="form-group">
                        <label for="password" style="color: #aaa; font-size: 13px; display: block; margin-bottom: 5px;">Contraseña <span id="passwordHint" style="color: #f39c12; font-size: 11px;">(requerido)</span></label>
                        <input type="password" id="password" 
                               style="width: 100%; padding: 10px; background: #252535; border: 1px solid #3a3a4e; border-radius: 6px; color: white; box-sizing: border-box;"
                               placeholder="Mínimo 6 caracteres">
                    </div>
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label for="nombreCompleto" style="color: #aaa; font-size: 13px; display: block; margin-bottom: 5px;">Nombre Completo</label>
                    <input type="text" id="nombreCompleto" 
                           style="width: 100%; padding: 10px; background: #252535; border: 1px solid #3a3a4e; border-radius: 6px; color: white; box-sizing: border-box;"
                           placeholder="Ej: Juan Pérez Sánchez">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
                    <div class="form-group">
                        <label for="email" style="color: #aaa; font-size: 13px; display: block; margin-bottom: 5px;">Email</label>
                        <input type="email" id="email" 
                               style="width: 100%; padding: 10px; background: #252535; border: 1px solid #3a3a4e; border-radius: 6px; color: white; box-sizing: border-box;"
                               placeholder="juan@empresa.com">
                    </div>

                    <div class="form-group">
                        <label for="rol" style="color: #aaa; font-size: 13px; display: block; margin-bottom: 5px;">Rol *</label>
                        <select id="rol" required 
                                style="width: 100%; padding: 10px; background: #252535; border: 1px solid #3a3a4e; border-radius: 6px; color: white; box-sizing: border-box;">
                            <option value="admin">👑 Administrador</option>
                            <option value="cajero">💰 Cajero</option>
                            <option value="invitado">👤 Invitado</option>
                        </select>
                    </div>
                </div>

                <div class="button-group" style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="hideUserForm()"
                            style="background: #616161; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer;">
                        Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary" id="userSubmitBtn"
                            style="background: linear-gradient(90deg, #4CAF50, #45a049); color: white; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; font-weight: 600;">
                        Crear Usuario
                    </button>
                </div>
            </form>
        </div>

        <!-- Botón cerrar -->
        <div class="button-group" style="margin-top: 20px; text-align: center;">
            <button type="button" class="btn btn-secondary" onclick="closeUserManagementModal()"
                    style="background: #f44336; color: white; border: none; padding: 12px 40px; border-radius: 6px; cursor: pointer; font-weight: 600;">
                Cerrar
            </button>
        </div>
    </div>
</div>

<style>
#userList::-webkit-scrollbar {
    width: 8px;
}
#userList::-webkit-scrollbar-track {
    background: #1a1a28;
    border-radius: 4px;
}
#userList::-webkit-scrollbar-thumb {
    background: #4CAF50;
    border-radius: 4px;
}
#userList::-webkit-scrollbar-thumb:hover {
    background: #45a049;
}
</style>
