<!-- Modal de Editar Lote -->
        <div id="editLoteModal" class="edit-modal">
            <div class="edit-form" style="max-width: 600px;">
                <h3 style="margin-bottom: 20px; color: #f4f7fa;">✏️ Editar Lote</h3>

                <form id="editLoteForm">
                    <input type="hidden" id="editLoteId">

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div class="form-group">
                            <label for="editLoteNumero">Número de Lote *</label>
                            <input type="text" id="editLoteNumero" required style="width: 100%; padding: 10px; border: 2px solid #030303; border-radius: 6px;">
                        </div>

                        <div class="form-group">
                            <label for="editLoteFechaVencimiento">Fecha de Vencimiento *</label>
                            <input type="date" id="editLoteFechaVencimiento" required style="width: 100%; padding: 10px; border: 2px solid #030303; border-radius: 6px;">
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div class="form-group">
                            <label for="editLoteBarcode">Código de Barras EAN-13</label>
                            <input type="text" id="editLoteBarcode" placeholder="Escanee o ingrese código EAN-13" style="width: 100%; padding: 10px; border: 2px solid #030303; border-radius: 6px;" maxlength="13" pattern="[0-9]{13}">
                            <small style="color: #666; font-size: 12px;">Código de barras único para este lote</small>
                            <div id="editBarcodeValidation" style="margin-top: 5px; font-size: 12px;"></div>
                        </div>

                        <div class="form-group">
                            <label for="editLoteBarcodeScanner">Escanear Código</label>
                            <button type="button" id="editLoteBarcodeScanner" class="btn btn-secondary" style="width: 100%; padding: 10px; font-size: 14px;" onclick="openBarcodeScannerForEditLote()">
                                📱 Escanear con Cámara
                            </button>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div class="form-group">
                            <label for="editLoteCostoUnitario">Costo Unitario (opcional)</label>
                            <input type="number" id="editLoteCostoUnitario" step="0.01" min="0" style="width: 100%; padding: 10px; border: 2px solid #030303; border-radius: 6px;">
                        </div>

                        <div class="form-group">
                            <label for="editLoteNotas">Notas</label>
                            <input type="text" id="editLoteNotas" style="width: 100%; padding: 10px; border: 2px solid #030303; border-radius: 6px;">
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div class="form-group">
                            <label for="editLoteCodigoBarras">Código de Barras EAN-13 (opcional)</label>
                            <input type="text" id="editLoteCodigoBarras" placeholder="Ej: 1234567890123" maxlength="13" style="width: 100%; padding: 10px; border: 2px solid #030303; border-radius: 6px;">
                            <small style="color: #666; font-size: 12px;">Debe ser un código EAN-13 válido de 13 dígitos</small>
                        </div>

                        <div class="form-group">
                            <label>&nbsp;</label>
                            <button type="button" onclick="scanBarcodeForEditLote()" class="btn btn-secondary" style="width: 100%; padding: 10px; background: #17a2b8; color: white;">
                                📱 Escanear Código de Barras
                            </button>
                        </div>
                    </div>

                    <div class="button-group">
                        <button type="button" class="btn btn-primary" onclick="updateLote()">Actualizar Lote</button>
                        <button type="button" class="btn btn-secondary" onclick="closeEditLoteModal()">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
