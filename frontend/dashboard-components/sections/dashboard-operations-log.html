<!-- Sección de Registro de Operaciones -->
        <div id="operations-log-section" class="dashboard-section collapsed">
            <h2 class="section-header">
                <span class="section-title">📋 Registro de Operaciones</span>
                <span class="section-icon">▶</span>
            </h2>
            <div class="section-content">
                <div style="margin-bottom: 20px;">
                    <button class="btn btn-secondary btn-spacing" onclick="loadOperationsLog()">
                        🔄 Actualizar
                    </button>
                    <button class="btn btn-secondary btn-spacing color-red background-red" onclick="clearOperationsLog()">
                        🗑️ Limpiar Registro
                    </button>
                </div>

                <!-- Configuración de Logging -->
                <div style="margin-bottom: 20px; padding: 15px; background: #366594; border-radius: 8px; border: 1px solid #dee2e6;">
                    <h4 style="margin: 0 0 10px 0; color: #ebeef1;">⚙️ Configuración del Registro</h4>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <label for="logging-toggle" style="font-weight: 500; cursor: pointer; color: white;">
                            Habilitar registro de actividad:
                        </label>
                        <label class="switch">
                            <input type="checkbox" id="logging-toggle" onchange="toggleLogging(this.checked)">
                            <span class="slider round"></span>
                        </label>
                        <span id="logging-status" style="font-size: 12px; color: #f05d5d;">Cargando...</span>
                    </div>
                    <p style="margin: 10px 0 0 0; font-size: 12px; color: #c45959;">
                        Deshabilitar para ahorrar consumo del sistema. Las operaciones no se registrarán cuando esté desactivado.
                    </p>
                </div>

                <div class="loading">Cargando registro de operaciones...</div>
                <div id="operations-log-container" style="display:none;">
                    <div id="operations-list" style="max-height: 400px; overflow-y: auto; border: 1px solid #030303; border-radius: 8px; padding: 10px; background: #2c5986;">
                        <!-- Las operaciones se mostrarán aquí -->
                    </div>
                </div>
